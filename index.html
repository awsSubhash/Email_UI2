<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Email Sender</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 50px; text-align: center; }
        input, textarea { width: 100%; padding: 10px; margin: 5px 0; }
        button { padding: 10px 20px; background: blue; color: white; border: none; cursor: pointer; }
    </style>
</head>
<body>

    <h2>Send an Email</h2>
    <form id="emailForm">
        <input type="email" id="to" placeholder="Recipient Email" required><br>
        <input type="text" id="subject" placeholder="Subject" required><br>
        <textarea id="message" placeholder="Message" rows="5" required></textarea><br>
        <button type="submit">Send Email</button>
    </form>

    <p id="responseMessage"></p>

    <script>
        document.getElementById('emailForm').addEventListener('submit', async function(event) {
            event.preventDefault();

            const to = document.getElementById('to').value;
            const subject = document.getElementById('subject').value;
            const message = document.getElementById('message').value;
            const responseMessage = document.getElementById('responseMessage');

            try {
                const response = await fetch('http://localhost:3000/send-email', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ to, subject, message })
                });

                const result = await response.json();
                responseMessage.textContent = result.success ? "Email Sent Successfully!" : "Failed to Send Email";
                responseMessage.style.color = result.success ? "green" : "red";
            } catch (error) {
                responseMessage.textContent = "Error sending email.";
                responseMessage.style.color = "red";
            }
        });
    </script>

</body>
</html>
